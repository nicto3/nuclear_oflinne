name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Move uploaded files into place
        shell: bash
        run: |
          move() {
            if [ -f "$1" ]; then
              mkdir -p "$(dirname "$2")"
              mv -f "$1" "$2"
              echo "moved $1 -> $2"
            fi
          }
          TAURI=packages/player/src-tauri
          RS=$TAURI/src
          TS=packages/player/src
          move Cargo.toml $TAURI/Cargo.toml
          move miniplayer.json $TAURI/capabilities/miniplayer.json
          move lib.rs $RS/lib.rs
          move offline.rs $RS/offline.rs
          move stream_server.rs $RS/stream_server.rs
          move tray.rs $RS/tray.rs
          move main.tsx $TS/main.tsx
          move initPlayerApp.tsx $TS/initPlayerApp.tsx
          move MiniPlayer.tsx $TS/miniPlayer/MiniPlayer.tsx
          move initMiniPlayer.tsx $TS/miniPlayer/initMiniPlayer.tsx
          move miniPlayerTypes.ts $TS/miniPlayer/miniPlayerTypes.ts
          move miniPlayerBridge.ts $TS/services/miniPlayer/miniPlayerBridge.ts
          move offlineCandidates.ts $TS/services/offline/offlineCandidates.ts
          move offlineDownloads.ts $TS/services/offline/offlineDownloads.ts
          move offlineUrl.ts $TS/services/offline/offlineUrl.ts
          move offline.ts $TS/services/tauri/offline.ts
          move audioSource.ts $TS/services/streamResolution/audioSource.ts
          move offlineStore.ts $TS/stores/offlineStore.ts
          move OfflinePlaylistRow.tsx $TS/views/Offline/components/OfflinePlaylistRow.tsx
          grep -q offline_download_hls $RS/offline.rs || (echo "HLS patch is missing" && exit 1)
          grep -q init_tray $RS/lib.rs || (echo "Tray patch is missing" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable signed updates, upstream auto-update and set build version
        shell: bash
        env:
          FORK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'packages/player/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = '1.51.' + (100 + Number(process.env.RUN_NUMBER));
          config.bundle.createUpdaterArtifacts = false;
          config.plugins.updater.endpoints = [process.env.FORK_UPDATE_URL];
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: nuclear-offline-windows
          if-no-files-found: error
          path: |
            packages/player/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/player/src-tauri/target/release/bundle/msi/*.msi
