name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Move uploaded files into place
        shell: bash
        run: |
          if [ ! -f layout.txt ]; then
            echo "layout.txt is missing: upload it together with the other files"
            exit 1
          fi
          tr -d '\r' < layout.txt | while read -r src dest; do
            case "$src" in ''|\#*) continue ;; esac
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              mv -f "$src" "$dest"
              echo "moved $src -> $dest"
            fi
          done
          RS=packages/player/src-tauri/src
          grep -q offline_download_hls $RS/offline.rs || (echo "HLS patch is missing" && exit 1)
          grep -q init_tray $RS/lib.rs || (echo "Tray patch is missing" && exit 1)
          grep -q offline_import_file $RS/offline.rs || (echo "Offline library patch is missing" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable signed updates, upstream auto-update and set build version
        shell: bash
        env:
          FORK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'packages/player/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = '1.51.' + (100 + Number(process.env.RUN_NUMBER));
          config.bundle.createUpdaterArtifacts = false;
          config.plugins.updater.endpoints = [process.env.FORK_UPDATE_URL];
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: nuclear-offline-windows
          if-no-files-found: error
          path: |
            packages/player/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/player/src-tauri/target/release/bundle/msi/*.msi
